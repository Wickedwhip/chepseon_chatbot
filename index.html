 <!-- # Main webpage (chatbox interface) -->
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chepseon TVC Chatbot</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header>
    <div class="chat-header">
        <img src="assets/images/chepseon_logo.png" alt="Chepseon TVC Logo" class="logo">
        <h2>Chepseon TVC Chatbot</h2>
    </div>

  </header>

  <main>
    <div class="chat-container">
      <div class="chat-box" id="chat-box">
        <div class="bot-message">
          👋 Hi! I'm your Chepseon TVC assistant. How can I help you today?
        </div>
      </div>

      <div class="chat-input">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </main>

  <script src="assets/js/script.js"></script>
<!-- Floating WhatsApp Contact Button -->
<a href="https://wa.me/254798663330?text=Welcome%20to%20Chepseon%20Customer%20Care%2C%20How%20may%20I%20help%20you%3F%20👋"
   target="_blank"
   class="whatsapp-float"
   title="Chat on WhatsApp">
  💬 Contact Support
</a>



</body>
</html>
